<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Résultat de prédiction immobilière</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@3.9.4/dist/full.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-base-100">
    <div class="hero min-h-screen bg-base-200">
        <div class="hero-content text-center">
            <div class="max-w-md">
                <div class="card bg-base-100 shadow-xl">
                    <div class="card-body">
                        <h1 class="text-3xl font-bold text-primary">Résultat de la prédiction</h1>
                        <div class="py-6">
                            <div class="stat">
                                <div class="stat-title text-lg">Prix estimé</div>
                                <div class="stat-value text-secondary my-4">{{ prediction }} €</div>
                                <div class="stat-desc">Valeur calculée selon vos critères</div>
                            </div>
                        </div>
                        <div class="card-actions justify-center mt-4">
                            <a href="{{ url_for('main.maison_critere') }}" class="btn btn-primary">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                    <path fill-rule="evenodd" d="M9.707 16.707a1 1 0 01-1.414 0l-6-6a1 1 0 010-1.414l6-6a1 1 0 011.414 1.414L5.414 9H17a1 1 0 110 2H5.414l4.293 4.293a1 1 0 010 1.414z" clip-rule="evenodd" />
                                </svg>
                                Retour au formulaire
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
